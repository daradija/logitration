name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: test_library (103)
        run: python tests/test_library.py
      - name: test_ideas (93)
        run: python tests/test_ideas.py
      - name: test_design (69)
        run: python tests/test_design.py
      - name: test_program (77)
        run: python tests/test_program.py
      - name: test_types (53)
        run: python tests/test_types.py
