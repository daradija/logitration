[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "logitration"
version = "0.2.0"
description = "Write one idea file (a conversation, your logic, your meta-interpreter), try it in the terminal, serve it over A2A"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
classifiers = ["License :: Other/Proprietary License", "Programming Language :: Python :: 3"]
authors = [{ name = "David Ragel" }]
dependencies = []

[project.scripts]
logi = "logitration.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["logitration"]
